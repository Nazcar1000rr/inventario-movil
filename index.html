<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <!--CSP-->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Inventario Móvil</title>
    <meta name="description" content="Inventario, compras, ventas y rentabilidad. Datos guardados solo en este dispositivo." />
    <meta name="theme-color" content="#0d6b58" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171b20" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Inventario" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // Apariencia guardada (claro/oscuro, color, estilo, animaciones) antes de pintar, para que no parpadee.
      (function () {
        try {
          var s = localStorage, r = document.documentElement;
          var m = s.getItem('ui:mode');
          if (m === 'light' || m === 'dark') r.setAttribute('data-theme', m);
          r.setAttribute('data-accent', s.getItem('ui:accent') || 'verde');
          r.setAttribute('data-style', s.getItem('ui:style') === 'gradient' ? 'gradient' : 'solid');
          var mo = s.getItem('ui:motion');
          r.setAttribute('data-motion', mo === 'lite' || mo === 'full' ? mo : window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'lite' : 'full');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta aplicación necesita JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
