# Publica la PWA (versión para iPhone) en GitHub Pages con HTTPS.
# Activar una sola vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# La URL será https://<usuario>.github.io/<repositorio>/
# Solo se publican los archivos de la app: los datos de cada persona quedan en su teléfono.
name: PWA en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
